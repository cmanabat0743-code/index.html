<!DOCTYPE html>
<html>
<head>
    <title>Lab Exercise #3 HTML Forms</title>
</head>
<body>

<h1 style= >How can we help?</h1>

<form>
    <fieldset>
        <legend style= >Request for Proposal</legend>

        <table>
            <tr>
                <td>Your company:</td>
                <td><input type="text" name="company"></td>
            </tr>

            <tr>
                <td>Email:</td>
                <td><input type="email" name="email"></td>
            </tr>

            <tr>
                <td>Username:</td>
                <td><input type="text" name="username"></td>
            </tr>

            <tr>
                <td>Password:</td>
                <td><input type="password" name="password"></td>
            </tr>

            <tr>
                <td valign="top">Your Business:</td>
                <td>
                    <textarea rows="6" cols="30">
Briefly describe your business in this space
                    </textarea>
                </td>
            </tr>

            <tr>
                <td valign="top">Company size:</td>
                <td>
                    <input type="radio" name="size"> Less than 10 <br>
                    <input type="radio" name="size"> 11 to 50 <br>
                    <input type="radio" name="size"> 50 to 200 <br>
                    <input type="radio" name="size"> Over 200
                </td>
            </tr>

            <tr>
                <td>Service:</td>
                <td>
                    <input type="checkbox"> Brand Identity
                    <input type="checkbox"> New Website
                    <input type="checkbox"> Web Redesign
                </td>
            </tr>

            <tr>
                <td>Timeline:</td>
                <td>
                    <select>
                        <option>Immediately</option>
                        <option>1-2 weeks</option>
                        <option>3-6 weeks</option>
                        <option>7-2 months</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Send to dev / design">
                </td>
            </tr>
        </table>
    </fieldset>
</form>


</body>
</html>
