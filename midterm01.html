<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>ride request</title>
  
  <style>
  body{
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f4f4;
  }
  
  .navbar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    gap: 2px;
    background-color: purple;
  }
  
  .search{
    width: 300px;
    padding: 8px;
    border-radius: 20px;
    border: none;
  }
  
  .download-bth{
    background: purple;
    color: white;
    border: 1px solid white;
    padding: 8px 15px;
  }
  
  .container{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 50vh;
  }
  
  .home{
    color: white;
  }
  
  .card{
    border: 3px solid black;
    padding: 20px;
    width: 350px;
    background: white;
  }
  
  .card input{
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
  }
  
  .buttons{
    display: flex;
    gap: 10px;
  }
  
  .request{
    background: black;
    color: white;
    padding: 10px;
    border: none;
  }
  
  .schedule{
    background:#ddd;
    padding: 10px;
    border: none;
  }
  
  </style>
  
</head>
<body>
  
  <div class="navbar">
    <div class="home">Home</div>
    <input type="text" placeholder="Search" class="search">
    <button class="download-bth">Download</button>
  </div>
  
  <div class="container">
    <div class="card">
      <h2>Request a ride now</h2>
      
      <input type="text" placeholder="Enter pickup location">
      <input type="text" placeholder="Enter destination">
      
      <div class="buttons">
        <button class="request">Request now</button>
        <button class="schedule">Schedule for later</button>
      </div>
    </div>
  </div>
  
</body>
</html>
