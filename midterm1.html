<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title> Grid </title>
  
  <style>
  
  #g-container{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 150px 150px 100px;
    gap: 10px;
    padding: 30px;
    background-color: skyblue;
    grid-template-areas: "sidebar header header header2" "sidebar content content2 sidebar2"
    "sidebar footer footer2 sidebar2"
  }
  
  #g-item1{
    background-color: red;
    grid-area: sidebar;
  }
  
  #g-item2{
    background-color: red;
    grid-area: header;
  }
  
  #g-item3{
    background-color: blue;
    grid-area: header2;
  }
  
  #g-item4{
    background-color: green; 
    grid-area: content;
  }
  
  #g-item5{
    background-color: blue;
    grid-area: content2;
  }
  
  #g-item6{
    background-color: red;
    grid-area: sidebar2;
  }
  
  #g-item7{
    background-color: blue;
    grid-area: footer;
  }
  #g-item8{
    background-color: green;
    grid-area: footer2;
  }
  
  
  </style>
</head>
<body>
  
   <div id="g-container">
  <div id="g-item1" class="s1"> </div>
  <div id="g-item2" class="s1"> </div>
  <div id="g-item3" class="s1"> </div>
  <div id="g-item4" class="s1"> </div>
  <div id="g-item5" class="s1"> </div>
  <div id="g-item6" class="s1"> </div>
  <div id="g-item7" class="s1"> </div>
  <div id="g-item8" class="s1"> </div>
     
  </div>
</body>
</html>
